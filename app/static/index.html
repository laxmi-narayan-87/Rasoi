<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rasoi — Indian Recipe Finder</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="wrap"><header><p class="eyebrow">YOUR LOCAL RECIPE FINDER</p><h1>What can you cook?</h1><p class="muted">Add the ingredients you have. Discover dishes and open a recipe for the full method.</p></header><section class="panel"><label for="ingredients">Ingredients</label><textarea id="ingredients" rows="3" placeholder="potato, onion, tomato, cumin"></textarea><div class="filters"><label>Diet<select id="diet"><option value="any">Any</option><option value="vegetarian">Vegetarian</option><option value="non-vegetarian">Non-vegetarian</option><option value="egg">Egg</option><option value="unknown">Unclassified</option></select></label><label>Max minutes<select id="max-time"><option value="">Any</option><option>15</option><option>30</option><option>45</option><option>60</option><option>90</option></select></label></div><button id="search">Find recipes</button><p id="status" class="muted" role="status"></p></section><section><div class="section-head"><h2 id="results-title">Recipe ideas</h2><button id="browse" class="secondary">Browse recipes</button><button id="surprise" class="secondary">Surprise me</button></div><div id="results" class="results"></div></section><section id="detail" class="panel hidden"></section><footer class="muted">Rasoi · local dataset · no account or search history</footer></main><script src="/static/app.js"></script></body></html>
