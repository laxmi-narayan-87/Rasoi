name: Python tests and dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Reject unresolved merge-conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.yml' '.gitignore'; then
            echo "Unresolved merge-conflict markers found."
            exit 1
          fi
      - name: Compile Python sources
        run: python -m compileall -q app api *.py
      - name: Run importer tests
        run: python -m unittest discover -s tests -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt
